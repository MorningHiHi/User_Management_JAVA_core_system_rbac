spring.application.name=core_system_rbac
# 1. Cấu hình kết nối Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/RBAC_system
spring.datasource.username=sangnguyenthac
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Cấu hình ép ORM (Hibernate) không được tự động tạo bảng
spring.jpa.hibernate.ddl-auto=validate

# 3. Cấu hình Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Phơi bày toàn bộ các endpoint của Actuator ra môi trường Web
management.endpoints.web.exposure.include=*
management.metrics.tags.application=${spring.application.name}

# Access Token sống 30 phút (1.800.000 ms)
jwt.expiration=1800000

# Refresh Token sống 7 ngày (604.800.000 ms)
jwt.refreshExpiration=604800000

# Secret Key (Đảm bảo key của bạn đủ dài)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970