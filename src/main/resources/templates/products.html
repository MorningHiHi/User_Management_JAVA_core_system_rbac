<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management Dashboard</title>

    <!-- Tích hợp Tailwind CSS qua CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts cho Typography hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome cho hệ thống Icon -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Cấu hình màu sắc tùy chỉnh cho Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: '#8C5A35', // Tone màu nâu sang trọng, mộc mạc
                        brandHover: '#6B4226'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8">

<!-- Container chính giới hạn chiều rộng -->
<div class="w-full max-w-5xl space-y-8">

    <!-- Header Panel -->
    <header class="flex items-center justify-between bg-white px-8 py-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center gap-4">
            <div class="bg-orange-50 text-brand w-12 h-12 flex items-center justify-center rounded-xl">
                <i class="fa-solid fa-store text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Products Dashboard</h1>
                <p class="text-sm text-slate-500 font-medium mt-1">Hệ thống quản lý sản phẩm và biểu giá</p>
            </div>
        </div>
    </header>

    <!-- Bố cục Grid: 2 cột (Danh sách) và 1 cột (Form) trên Desktop -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- Khu vực Danh sách sản phẩm (Chiếm 2/3) -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">

                <!-- Tiêu đề bảng -->
                <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-slate-400"></i> View Products
                    </h2>
                    <span class="text-xs font-medium bg-slate-100 text-slate-600 px-3 py-1 rounded-full border border-slate-200">
                            Inventory List
                        </span>
                </div>

                <!-- Bảng dữ liệu -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                        <tr class="bg-white text-xs uppercase tracking-wider text-slate-500 font-semibold border-b border-slate-100">
                            <th class="px-6 py-4">Product Name</th>
                            <th class="px-6 py-4 text-right">Product Price</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50 text-sm">

                        <!-- Khối lặp Thymeleaf -->
                        <tr th:each="p: ${products}" class="hover:bg-slate-50 transition-colors duration-150 group">
                            <td class="px-6 py-4 whitespace-nowrap font-medium text-slate-800">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 group-hover:text-brand transition-colors">
                                        <i class="fa-solid fa-mug-saucer text-xs"></i>
                                    </div>
                                    <span th:text="${p.name}">Tên sản phẩm</span>
                                </div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-right font-semibold text-slate-700">
                                <span th:text="${p.price}">0</span> đ
                            </td>
                        </tr>

                        <!-- Trạng thái trống (Tùy chọn hiển thị đẹp mắt) -->
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="2" class="px-6 py-12 text-center text-slate-500">
                                <div class="flex flex-col items-center justify-center gap-3">
                                    <i class="fa-solid fa-box-open text-4xl text-slate-300"></i>
                                    <p>Chưa có sản phẩm nào trong cửa hàng.</p>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Khu vực Form thêm sản phẩm (Chiếm 1/3) -->
        <div class="lg:col-span-1">
            <!-- Form được làm dính (sticky) khi cuộn chuột -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 sticky top-6">
                <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50 rounded-t-2xl">
                    <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-brand"></i> Add a Product
                    </h2>
                </div>

                <div class="p-6">
                    <form action="/products" method="post" class="space-y-5">

                        <!-- Nhập Tên -->
                        <div>
                            <label for="name" class="block text-sm font-medium text-slate-700 mb-1.5">
                                Product Name
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-tag text-slate-400"></i>
                                </div>
                                <input type="text" id="name" name="name" required
                                       class="block w-full pl-10 pr-3 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand/20 focus:border-brand transition-all outline-none bg-slate-50 focus:bg-white"
                                       placeholder="Nhập tên sản phẩm...">
                            </div>
                        </div>

                        <!-- Nhập Giá -->
                        <div>
                            <label for="price" class="block text-sm font-medium text-slate-700 mb-1.5">
                                Product Price
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-coins text-slate-400"></i>
                                </div>
                                <input type="number" step="any" id="price" name="price" required
                                       class="block w-full pl-10 pr-3 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand/20 focus:border-brand transition-all outline-none bg-slate-50 focus:bg-white"
                                       placeholder="0.00">
                            </div>
                        </div>

                        <!-- Nút Submit -->
                        <button type="submit"
                                class="w-full flex items-center justify-center gap-2 bg-brand hover:bg-brandHover text-white font-medium py-2.5 px-4 rounded-xl transition-all duration-200 shadow-sm shadow-brand/30 active:scale-[0.98] mt-2">
                            <i class="fa-solid fa-check"></i> Save Product
                        </button>

                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
